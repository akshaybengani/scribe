<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Scribe">
  <!-- Scribe app icon: "caret wave". Four bars of sound end in a text cursor (speech in, words out).
       Graphite tile on the macOS 824 grid, grey wave, lime caret. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#111317"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#272B33" stroke-width="6"/>
  <!-- the wave -->
  <rect x="222" y="432" width="64" height="160" rx="32" fill="#8B94A1"/>
  <rect x="330" y="362" width="64" height="300" rx="32" fill="#8B94A1"/>
  <rect x="438" y="292" width="64" height="440" rx="32" fill="#8B94A1"/>
  <rect x="546" y="392" width="64" height="240" rx="32" fill="#8B94A1"/>
  <!-- the text caret (I-beam) -->
  <rect x="706" y="252" width="64" height="520" rx="12" fill="#C6F135"/>
  <rect x="674" y="252" width="128" height="48" rx="24" fill="#C6F135"/>
  <rect x="674" y="724" width="128" height="48" rx="24" fill="#C6F135"/>
</svg>
